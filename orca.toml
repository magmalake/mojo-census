# How the census's pipelines run under orca. `orca register` (no arguments) in
# the scheduler container reads this file: the image has it at
# /opt/orca/orca.toml (ORCA_CONFIG) and the binaries at /opt/orca/pipelines.
# To change a setting: edit this file, merge, deploy the new image, register
# again. magmalake/orca.mojo docs/orca-toml.md and docs/hetzner.md say more.

[defaults]
# One run of a pipeline at a time. Concurrent commits to one table are safe
# since iceberg-mojo 0.11.1 (magmalake/orca.mojo#164), but on the CAX21 the
# cores, not the runs, are the limit: gharchive goes faster with more hours in
# flight in one run (below) than with more runs.
max_runs = 1

[pipelines.gharchive]
# Fill the whole range (from the first partition to yesterday) by itself,
# oldest day first, one fill run at a time on top of max_runs.
fills = "all"
fill_order = "oldest"
fill_max_runs = 1
# DISTA_WORKER_SLOTS: dista workers in one process. GHARCHIVE_PARALLEL: hours
# in flight at once; its default of 16 is sized for four AWS instances. Keep
# the two equal. Before #37 an hour in flight took 2 GB or more: on the CAX21
# (4 vCPU, 8 GB), 16 hit 99.6% memory and the kernel killed workers, 3 peaked
# near 7 GB and swapped hard, and 2 and 2 peaked under 2 GB and ran a day in
# about 3.5 minutes. Since #37 an hour takes about 450 MB (HOUR_MEMORY_MB in
# src/eventrows.mojo), plus about 300 MB for the run: 4 and 4 is the safe
# value on the CAX21: a busy 2023 day under 4 vCPU and 8 GB peaked at 1.8 GB
# and ran 26% faster than at 2 and 2 before #37 (2 and 2 now peak at 1.2 GB);
# above 4 the cores, not memory, are the limit. On the CAX41 (16 vCPU, 32 GB)
# 12 and 12, about 5.7 GB.
#
# Timeouts and retries of an hour's download (#49), defaults in brackets:
# GHARCHIVE_CONNECT_SECONDS (20) for the connect and TLS handshake,
# GHARCHIVE_IDLE_SECONDS (30) of silence before a stalled read fails,
# GHARCHIVE_TIMEOUT_SECONDS (900) for the whole hour, every try included, and
# GHARCHIVE_RETRIES (4) after the first try, with backoff 1 s, 2 s, 4 s ...
# up to 30 s (README, "Timeouts and retries"). Before #49 a stalled read
# had no timeout, and a fill run waited 5 h 39 m on one.
#
# GHARCHIVE_EVENTS (on): off stops writing gharchive.events (1.1 GB a day,
# 97% of the bucket) and keeps candidates, repo_hour and releases, the same
# rows either way. An hour in flight then takes about 200 MB
# (HOUR_INDEX_MEMORY_MB) instead of 450 MB. The registry hash doesn't change,
# so runs done either way count. README, "Without the events".
env = { DISTA_WORKER_SLOTS = "4", GHARCHIVE_PARALLEL = "4" }

[pipelines.gharchive_index]
env = { DISTA_WORKER_SLOTS = "3" }

[pipelines.mojo_repos]
# With a token mojo_repos checks 1000 candidates a run, 25 without.
secrets = { GITHUB_TOKEN = "orca/github-token" }

[pipelines.mojo_history]
# Clones (here and in mojo_versions): GIT_TIMEOUT_SECONDS (600) kills one
# that runs longer, GIT_RETRIES (3) more tries with backoff, and git aborts a
# transfer under GIT_LOW_SPEED_LIMIT (1000) bytes a second for
# GIT_LOW_SPEED_SECONDS (60). A repository that still fails is logged and
# skipped for the run.
#
# One clone at a time on the CAX21 while these pipelines move from bgent to
# the server: their first runs there catch up all 500+ repositories, next to
# gharchive's fill, and a full clone of a large repository (modular/modular)
# can take GBs. Raise to 3 again once orca's run pages show the peak
# (magmalake/orca.mojo#200).
env = { DISTA_WORKER_SLOTS = "1" }

[pipelines.mojo_versions]
# Blobless clones of the repositories whose version is unknown, one dista
# task each; no GitHub API, so no token. One at a time, like mojo_history.
env = { DISTA_WORKER_SLOTS = "1" }

[pipelines.mojo_activity]
env = { DISTA_WORKER_SLOTS = "3" }

# Mondays at 06:00 UTC; one GET /repos/{owner}/{repo} per repository, which
# unauthenticated is 60 an hour.
[pipelines.mojo_stats]
secrets = { GITHUB_TOKEN = "orca/github-token" }
