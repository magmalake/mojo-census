# The lab stack's orca.toml (census #97 and #98, orca.mojo docs/hetzner.md,
# "A dev stack"): a server for testing orca itself, with none of the census's
# pipelines, only those whose inputs are made up to exercise it. The image
# has it at /opt/orca/orca.lab.toml; the lab stack's EXTRA_ENV_FILE sets
# ORCA_CONFIG=/opt/orca/orca.lab.toml, so `orca register` (no arguments)
# there reads this file.

[defaults]
max_runs = 1

[pipelines.ballast]
# Learned (orca #269), the subject of the test: pipelines/ballast.mojo has
# each day's peaks. Run by hand, e.g.
#   docker exec scheduler orca backfill ballast 2011-01-01..2011-01-22
memory_gb = "auto"
cpus = "auto"
