name: CI

on:
  push:
    # dev: the branch the deployed images come from (orca.mojo
    # docs/hetzner.md, "A dev stack"); lab: the lab stack's, for testing orca
    # itself. main runs only the tests.
    branches: [main, dev, lab]
    tags: ['*']
  pull_request:

jobs:
  # Build every program and run the tests, as on a laptop.
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # pixi.lock is written by this version.
          pixi-version: v0.78.0
      - run: pixi run build
      - run: pixi run test
      # orca.dev.toml (the dev stack's) has orca.toml's pipelines, without
      # fills or a worker pool's placement, plus the dev-only ballast (#97).
      - name: orca.dev.toml matches orca.toml
        run: |
          diff <(grep '^\[pipelines\.' orca.toml) <(grep '^\[pipelines\.' orca.dev.toml | grep -vx '\[pipelines\.ballast\]')
          ! grep -nE '^[[:space:]]*(fills|fill_[a-z_]+|placement)[[:space:]]*=' orca.dev.toml

  # Build the image `orca aws push` builds, then run one hour of GH Archive
  # through the gharchive pipeline inside it: the Linux-only failures (a
  # library that won't link, a CA bundle in the wrong place) show up here
  # rather than on AWS. Not on main: what was merged there is built when it
  # reaches dev, the branch both stacks deploy from (pull requests still
  # build it, without pushing).
  image:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/magmalake/orca
    steps:
      - uses: actions/checkout@v4
      # Buildx, for its layer cache in GitHub's Actions cache: every layer
      # (mode=max, the intermediate stages too), so a commit that changes only
      # source reuses `pixi install` and the git build (see Dockerfile.orca).
      # load puts the image in the runner's docker, for the steps below.
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.orca
          tags: gharchive-image
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ORCA_SOURCE=https://github.com/${{ github.repository }}
            ORCA_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Size
        run: docker image ls gharchive-image --format '{{.Size}}'
      # Both settings files as `orca register` checks them.
      - name: orca config check, orca.toml, orca.dev.toml and orca.lab.toml
        run: |
          docker run --rm gharchive-image config check /opt/orca/orca.toml
          docker run --rm gharchive-image config check /opt/orca/orca.dev.toml
          docker run --rm gharchive-image config check /opt/orca/orca.lab.toml
      - name: One hour of 2025-01-01 inside the image
        run: |
          docker run --rm --entrypoint sh \
            -e GHARCHIVE_HOURS=0 -e ORCA_WAREHOUSE=/tmp/w gharchive-image \
            -c 'gharchive run --partitions 2025-01-01'
      # The encoder (max-core) links and loads in the image; its numbers are
      # checked by magmalake/encoder.mojo's own CI on the same runner type.
      - name: mojo_embed loads inside the image
        run: docker run --rm --entrypoint mojo_embed gharchive-image describe
      - name: The console starts and answers
        run: |
          docker run -d --name console -p 8080:8080 -e PORT=8080 \
            -e ORCA_WAREHOUSE=/tmp/w --entrypoint console gharchive-image
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs console
          exit 1
      # What deploy/hetzner expects in orca.mojo: ghcr.io/magmalake/orca:<tag>.
      # Pushed from the image tested above (native arm64), on dev and tags
      # only; pull requests build and test but never push. dev's are
      # <short sha> and dev, lab's <short sha> and lab, a tag's <short sha> and the tag without its v.
      # Nothing pushes latest any more: it stays at main's last image.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          tags="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$tags ${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_REF_NAME" = lab ]; then
            tags="$tags lab"
          else
            tags="$tags dev"
          fi
          for t in $tags; do
            docker tag gharchive-image "$GHCR_IMAGE:$t"
            docker push "$GHCR_IMAGE:$t"
          done

  # A tag's GitHub release, once its image is pushed: the notes are the
  # version's section of CHANGELOG.md (changes/README.md).
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$RUNNER_TEMP/notes.md
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          printf '\nImage: `ghcr.io/magmalake/orca:%s` (`:%s`).\n' "$version" "${GITHUB_SHA::7}" >> "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "mojo-census $version" --notes-file "$notes"
          fi
